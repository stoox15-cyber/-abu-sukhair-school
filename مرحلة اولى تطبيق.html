<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b43">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.jpeg">
<title>مدرسة أبو صخير الابتدائية للبنين</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f5f7f6;color:#17211c}
header{background:linear-gradient(135deg,#075b3a,#0b8a58);color:#fff;padding:28px 18px 24px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 5px 18px #0002}
.logo{width:96px;height:96px;object-fit:cover;border-radius:50%;background:#fff;padding:4px;box-shadow:0 3px 12px #0003}
h1{font-size:23px;margin:13px 0 5px}
.sub{font-size:14px;opacity:.9}
main{padding:18px;max-width:760px;margin:auto}
.notice{background:#fff;border-radius:18px;padding:16px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
.notice b{display:block;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{border:0;background:#fff;border-radius:18px;padding:18px 12px;text-align:center;box-shadow:0 2px 10px #0001;font-size:16px;font-weight:700;color:#173027;min-height:105px}
.icon{font-size:30px;display:block;margin-bottom:8px}
footer{text-align:center;padding:25px 15px;color:#66736d;font-size:12px}
button{font:inherit}
</style>
</head>
<body>
<header>
  <img class="logo" src="logo.jpeg" alt="شعار المدرسة">
  <h1>مدرسة أبو صخير الابتدائية للبنين</h1>
  <div class="sub">قضاء المناذرة – محافظة النجف الأشرف</div>
</header>
<main>
  <section class="notice">
    <b>📢 آخر الإعلانات</b>
    <div>مرحباً بكم في التطبيق الرسمي للمدرسة.</div>
  </section>

  <section class="grid">
    <button class="card"><span class="icon">📢</span>الإعلانات</button>
    <button class="card"><span class="icon">📝</span>الواجبات</button>
    <button class="card"><span class="icon">📚</span>الدروس والمواد</button>
    <button class="card"><span class="icon">📊</span>الدرجات والنتائج</button>
    <button class="card"><span class="icon">📅</span>الجدول الدراسي</button>
    <button class="card"><span class="icon">👨‍🏫</span>الكادر التدريسي</button>
    <button class="card"><span class="icon">📸</span>نشاطات المدرسة</button>
    <button class="card"><span class="icon">📞</span>التواصل مع الإدارة</button>
  </section>
</main>
<footer>النسخة التجريبية الأولى – مدرسة أبو صخير الابتدائية للبنين</footer>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
