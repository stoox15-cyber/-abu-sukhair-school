<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المعلمون - مدرسة أبو صخير</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    font-family:Arial,Tahoma,sans-serif;

    background:#f3f6f4;

    color:#222;

}

.header{

    background:linear-gradient(135deg,#174d36,#2d7655);

    color:white;

    text-align:center;

    padding:40px 20px;

    border-radius:0 0 35px 35px;

}

.header h1{

    margin:0 0 10px;

    font-size:32px;

}

.header p{

    margin:0;

    font-size:18px;

}

.container{

    max-width:800px;

    margin:auto;

    padding:25px 15px 40px;

}

.add-button{

    width:100%;

    border:0;

    background:#174d36;

    color:white;

    padding:18px;

    border-radius:18px;

    font-size:21px;

    font-weight:bold;

    margin-bottom:25px;

}

.teacher{

    background:white;

    padding:22px;

    margin-bottom:15px;

    border-radius:22px;

    box-shadow:0 4px 15px #ddd;

}

.teacher h2{

    color:#174d36;

    margin-top:0;

}

.teacher p{

    font-size:18px;

    margin:10px 0;

}

.delete{

    background:#b3261e;

    color:white;

    border:0;

    padding:10px 18px;

    border-radius:10px;

    font-size:16px;

}

.back{

    display:block;

    text-align:center;

    text-decoration:none;

    background:#555;

    color:white;

    padding:15px;

    border-radius:15px;

    margin-top:25px;

    font-size:18px;

}

.empty{

    text-align:center;

    background:white;

    padding:25px;

    border-radius:20px;

    color:#777;

}

</style>

</head>

<body>

<div class="header">

    <h1>👨‍🏫 المعلمون</h1>

    <p>مدرسة أبو صخير الابتدائية للبنين</p>

</div>

<div class="container">

<button class="add-button" onclick="addTeacher()">

    ➕ إضافة معلم

</button>

<div id="teachers">

<div class="teacher">

    <h2>👨‍🏫 إدارة المدرسة</h2>

    <p>🏫 مدرسة أبو صخير الابتدائية للبنين</p>

</div>

</div>

<a class="back" href="index.html">

    ↩️ العودة للرئيسية

</a>

</div>

<script>

function addTeacher(){

    let name = prompt("اكتب اسم المعلم:");

    if(!name){

        return;

    }

    let subject = prompt("اكتب المادة أو الاختصاص:");

    if(!subject){

        subject = "غير محدد";

    }

    let grade = prompt("اكتب الصف الذي يدرّسه:");

    if(!grade){

        grade = "غير محدد";

    }

    let phone = prompt("اكتب رقم الهاتف (اختياري):");

    if(!phone){

        phone = "غير متوفر";

    }

    let teacher = document.createElement("div");

    teacher.className = "teacher";

    teacher.innerHTML = `

        <h2>👨‍🏫 ${name}</h2>

        <p>📚 المادة: ${subject}</p>

        <p>🏫 الصف: ${grade}</p>

        <p>📞 الهاتف: ${phone}</p>

        <button class="delete" onclick="this.parentElement.remove()">

            🗑️ حذف

        </button>

    `;

    document.getElementById("teachers").appendChild(teacher);

}

</script>

</body>

</html>
